# E-MIN cluster config (plan P3.3): Chrono-Barlow over the cached
# Thalesian/AKK_300m encoder, L8 = top encoder block (the a-priori gate cell;
# the encoder has 9 hidden states 0..8 — "L11" was a 12-block model's index),
# full view menus (A2 engine defaults), GroupKFold-by-ruler eval.
# Seed comes from the sbatch grid: --seed {0..4}, --fold {0..4}.
run_name: emin_thalesian
features:
  kind: emb
  model: Thalesian/AKK_300m
  layer: 8
  site: mean
views:
  menu_a:
    - [mask_ruler, strip_formula]
    - [mask_ruler, crop16]
    - [mask_ruler, crop32]
    - [mask_ruler, drop_span]
    - [orthonorm]
  menu_b:
    - []
    - [mask_ruler]
  seeds: [0, 1]   # views.parquet is built with seeds 0,1
loss:
  lambda_rank: 1.0
  lambda_var: 0.1
  temp: 1.0
  lambda_offdiag: 0.005
train:
  epochs: 200
  lr: 0.001
  batch: 256
  seed: 0
eval_split: gkf_ruler
