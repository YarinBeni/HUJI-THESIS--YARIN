# P2 step 1b: kernel-CKA deconfounding of h vs provenance (lambda=5), raw tier0 features.
run_name: emin2_cunei400m_t0_akk_cka5_provenance
features:
  kind: emb
  model: Thalesian/cuneiformBase-400m
  layer: 12
  site: mean
views:
  menu_a:
  - - mask_ruler
    - strip_formula
  - - mask_ruler
    - crop16
  - - mask_ruler
    - crop32
  - - mask_ruler
    - drop_span
  - - orthonorm
  menu_b:
  - []
  - - mask_ruler
  seeds:
  - 0
  - 1
  langs:
  - akk
loss:
  lambda_rank: 1.0
  lambda_var: 0.1
  temp: 1.0
  lambda_offdiag: 0.005
  lambda_hsic: 5.0
  confound: provenance
  dep_measure: cka
train:
  epochs: 200
  lr: 0.001
  batch: 256
  seed: 0
eval_split: gkf_ruler
