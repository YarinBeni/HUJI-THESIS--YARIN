# P1 head ladder: llama2_7b, tier0 Akkadian, LEACE-erase 'length' from the frozen features
# (eraser fitted on train-fold orig views; see train_cjb 'erase').
run_name: emin2_llama2_7b_t0_akk_erase_length
features:
  kind: emb
  model: NousResearch/Llama-2-7b-hf
  layer: 16
  site: mean
  erase: length
views:
  menu_a:
  - - mask_ruler
    - strip_formula
  - - mask_ruler
    - crop16
  - - mask_ruler
    - crop32
  - - mask_ruler
    - drop_span
  - - orthonorm
  menu_b:
  - []
  - - mask_ruler
  seeds:
  - 0
  - 1
  langs:
  - akk
loss:
  lambda_rank: 1.0
  lambda_var: 0.1
  temp: 1.0
  lambda_offdiag: 0.005
train:
  epochs: 200
  lr: 0.001
  batch: 256
  seed: 0
eval_split: gkf_ruler
