# S2 SSL pretraining: byol on frozen llama2_7b features (L16 mean), source-balanced, no labels.
run_name: ssl_byol_llama2_7b
features:
  kind: emb
  model: NousResearch/Llama-2-7b-hf
  layer: 16
  site: mean
head:
  d_hidden: 512
  d_proj: 128
ssl:
  objective: byol
  balance_alpha: 0.5
  ema: 0.996
  lambda_offdiag: 0.005
  temp: 0.1
  lambda_var: 0.1
train:
  steps: 3000
  batch: 512
  lr: 0.001
  wd: 0.0001
  seed: 0
