# S3 fine-tune: llama2_7b, adapter init=barlow (SSL C10 head or none), 50% of dated train labels.
run_name: s3_llama2_7b_init-barlow_frac50
features:
  kind: emb
  model: NousResearch/Llama-2-7b-hf
  layer: 16
  site: mean
views:
  menu_a:
  - - mask_ruler
    - strip_formula
  - - mask_ruler
    - crop16
  - - mask_ruler
    - crop32
  - - mask_ruler
    - drop_span
  - - orthonorm
  menu_b:
  - []
  - - mask_ruler
  seeds:
  - 0
  - 1
  langs:
  - akk
loss:
  lambda_rank: 1.0
  lambda_var: 0.1
  temp: 1.0
  lambda_offdiag: 0.005
train:
  epochs: 200
  lr: 0.001
  batch: 256
  seed: 0
  label_frac: 0.5
eval_split: gkf_ruler
head:
  d_hidden: 512
  d_proj: 128
init_head: chrono/reports/ssl/heads/ssl_barlow_llama2_7b-s0.pt
