# S3 head-size arm: d_hidden=2048
run_name: s3_cunei400m_init-none_frac100_h2048
features:
  kind: emb
  model: Thalesian/cuneiformBase-400m
  layer: 12
  site: mean
views:
  menu_a:
  - - mask_ruler
    - strip_formula
  - - mask_ruler
    - crop16
  - - mask_ruler
    - crop32
  - - mask_ruler
    - drop_span
  - - orthonorm
  menu_b:
  - []
  - - mask_ruler
  seeds:
  - 0
  - 1
  langs:
  - akk
loss:
  lambda_rank: 1.0
  lambda_var: 0.1
  temp: 1.0
  lambda_offdiag: 0.005
train:
  epochs: 200
  lr: 0.001
  batch: 256
  seed: 0
eval_split: gkf_ruler
head:
  d_hidden: 2048
  d_proj: 128
